services:
  backend:
    build:
      context: ./backend
    container_name: pfe-ops-ci-backend
    ports:
      - "18001:8000"
    environment:
      PYTHONUNBUFFERED: "1"

      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: maf_db
      DB_USER: maf_user
      DB_PASSWORD: maf_password

      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3.1:8b
      OLLAMA_FAST_MODEL: llama3.2:3b
      OLLAMA_QUALITY_MODEL: llama3.1:8b
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:18001/api
    container_name: pfe-ops-ci-frontend
    depends_on:
      - backend
    ports:
      - "15176:15175"
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:18001/api

  mysql:
    image: mysql:8.0
    container_name: maf_ci_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: maf_db
      MYSQL_USER: maf_user
      MYSQL_PASSWORD: maf_password
    ports:
      - "3308:3306"
    volumes:
      - mysql_data_ci:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot_password || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  adminer:
    image: adminer
    container_name: maf_ci_adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    depends_on:
      mysql:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: maf_ci_ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama_data_ci:/root/.ollama
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

volumes:
  mysql_data_ci:
  ollama_data_ci: